[project]
name = "gtm-agent"
version = "0.1.0"
description = "Sample GTM agent built on deepagents with tools bound to skills (Claude Haiku 5.5)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "deepagents>=0.7.23",
    "langchain-anthropic>=1.7.5",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "decision-harness @ git+https://github.com/cwijayasundara/deep_agents_utils_v1.0.git@77da87e2c2421c8b819532c77caf07c51c190baf",
]

[project.optional-dependencies]
# Observability, mirroring the LangChain GTM agent blog post (LangSmith tracing)
langsmith = ["langsmith>=0.14.4"]
# Dev / test tooling
dev = ["pytest>=8.0"]
# Code interpreter: programmatic tool calling for deep agents (deepagents[quickjs] -> langchain-quickjs)
interpreter = ["deepagents[quickjs]>=0.7.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gtm_agent"]
